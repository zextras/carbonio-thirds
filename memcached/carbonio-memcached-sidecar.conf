# Drop-in for carbonio-memcached.service shipped only on distros that install
# the modern carbonio-memcached-sidecar.service (the main unit is shared with
# the legacy distros, where the sidecar is the -legacy one). Starting memcached
# pulls in its sidecar; Wants only, so a sidecar skipped by its token condition
# never blocks memcached. The sidecar declares PartOf=carbonio-memcached.service,
# so stop/restart propagate to it.
[Unit]
Wants=carbonio-memcached-sidecar.service
